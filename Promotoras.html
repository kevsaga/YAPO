<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YAPO | Promotoras</title> 
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="nav">    
        <nav>
            <a href="Inicio.html#inicio">Inicio</a>
            <a href="Inicio.html#Servicios">Servicios</a>
            <a href="Inicio.html#Contacto">Contacto</a>
        </nav>
    </header>

    <main>
        
        <section class="Presentacion">
            <div class="Presentacion-Descripcion">
                <h1>Panel de Promotores</h1>
                <p class="Rol">Sube tu experiencia y conecta con las mejores marcas.</p>
            </div>
            <div class="Presentacion-Logo">
                <img src="imagenes/Promotoras.png" alt="Promotoras" class="Tarjeta-im">
            </div>
        </section>

       
        <section class="seccion" id="catalogo">
            <h2>Perfiles disponibles</h2>
            <p class="Sobremi">Conoce a los promotores y escríbeles directamente.</p>

            <div class="Barra-filtros">
                <input type="search" class="Form-control" data-buscar placeholder="Buscar por nombre, ciudad o tipo (BTL, modelaje...)" aria-label="Buscar promotoras">
                <select class="Form-control" data-ciudad aria-label="Filtrar por ciudad"></select>
                <button type="button" class="btn-yapo" data-abrir="modalPromotora">Publicar mi perfil</button>
            </div>

            <div class="Tarjetas" id="listaPromotoras"></div>
        </section>
    </main>

    <dialog class="Modal" id="modalPromotora" aria-labelledby="tituloModalPromotora">
        <form method="dialog">
            <div class="Modal-cabecera">
                <h2 id="tituloModalPromotora">Publica tu perfil</h2>
            </div>
            <div class="Modal-cuerpo">
                <div class="Form-grupo">
                    <label for="p-nombre">Nombre completo</label>
                    <input class="Form-control" id="p-nombre" name="nombre" required maxlength="60">
                </div>
                <div class="Form-fila">
                    <div class="Form-grupo">
                        <label for="p-ciudad">Ciudad</label>
                        <input class="Form-control" id="p-ciudad" name="ciudad" required maxlength="40">
                    </div>
                    <div class="Form-grupo">
                        <label for="p-edad">Edad</label>
                        <input class="Form-control" id="p-edad" name="edad" type="number" min="18" max="70" required>
                    </div>
                </div>
                <div class="Form-fila">
                    <div class="Form-grupo">
                        <label for="p-estatura">Estatura (m)</label>
                        <input class="Form-control" id="p-estatura" name="estatura" placeholder="1.68" maxlength="4">
                    </div>
                    <div class="Form-grupo">
                        <label for="p-exp">Experiencia</label>
                        <select class="Form-control" id="p-exp" name="exp" required>
                            <option>Sin experiencia</option>
                            <option>Menos de 1 año</option>
                            <option>1 año</option>
                            <option>2 años</option>
                            <option>3 años</option>
                            <option>4 años</option>
                            <option>5 años o más</option>
                        </select>
                    </div>
                </div>
                <div class="Form-grupo">
                    <span class="Form-ayuda">Tipo de trabajo (elige uno o más)</span>
                    <div class="Opciones">
                        <label><input type="checkbox" name="tags" value="BTL"><span>BTL</span></label>
                        <label><input type="checkbox" name="tags" value="Eventos"><span>Eventos</span></label>
                        <label><input type="checkbox" name="tags" value="Modelaje"><span>Modelaje</span></label>
                        <label><input type="checkbox" name="tags" value="Impulso"><span>Impulso</span></label>
                    </div>
                </div>
                <div class="Form-grupo">
                    <label for="p-email">Correo de contacto</label>
                    <input class="Form-control" id="p-email" name="email" type="email" required>
                </div>
                <div class="Form-grupo">
                    <label for="p-foto">Foto</label>
                    <input class="Form-control" id="p-foto" name="foto" type="file" accept="image/*">
                </div>
                <label class="Form-check">
                    <input type="checkbox" name="consentimiento" required>
                    <span>Autorizo el tratamiento y la publicación de mis datos personales y mi foto en esta página (Ley 1581 de 2012).</span>
                </label>
                <p class="Form-error" role="alert"></p>
            </div>
            <div class="Modal-pie">
                <button type="button" class="btn-secundario" data-cerrar>Cancelar</button>
                <button type="submit" class="btn-yapo">Publicar perfil</button>
            </div>
        </form>
    </dialog>

    <footer class="Piepagina">
        <p>© 2026 Kevin y Sara</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
